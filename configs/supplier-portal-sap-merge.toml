# make merge-base CONFIG=configs/supplier-portal-sap-merge.toml — merge a good
# base into this base. A poor base is repaired first (make repair-base), then
# its result is merged.

# The base to merge into, in «Технические данные/bases/<name>/». Also the start
# of the output file name: <name>_<date>.xlsx.
name = "Портал поставщика SAP"

# Folder the Excel view of the base is written to.
output_dir = "/Users/19480633/Desktop/Базы знаний/Готовые базы"

# An entry of the good base answers a question already in this base with a
# DIFFERENT cause:
#   "accumulate" — keep both causes as a numbered list of possible causes;
#   "replace"    — the merged answer wins, the old one is dropped.
# Answers that say the same thing or contradict each other are always replaced.
merge_strategy = "accumulate"

# The good base: an Excel file this project wrote (make run, make repair-base);
# replace the example with the file to merge. A file already merged into the
# base (same content) is skipped.
[source]
path = "/Users/19480633/Desktop/Базы знаний/Готовые базы/Хорошая база_2026-10-02.xlsx"

# What the model is told about the domain.
[domain]
# Substituted into every prompt: «служба поддержки <name>».
name = "портала поставщика SAP"

# Categories offered to the model: the key is stored in the entry, the value is
# shown to the model as its description.
[domain.categories]
how_to = "как выполнить действие: где найти, как создать, изменить, настроить"
troubleshooting = "ошибки и сбои: что-то не работает, не открывается, не сохраняется"
access = "доступы, роли, права, регистрация, вход, пароли"
documents = "документы и файлы: загрузка, формирование, подписание, форматы"
data = "данные и отчёты: выгрузки, поиск, проверка значений"
policy = "правила, регламенты, сроки, зоны ответственности"
other = "не подходит ни одна категория выше"
